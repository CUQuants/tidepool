# TidePool Data Collector Configuration

# Market pairs to collect data from
# Use Kraken's pair notation (e.g., BTC/USD, ETH/USD)
markets:
  - EUR/USD
  - EURQ/USD
  - EURQ/EUR
  - EURR/USD
  - EURR/EUR
  - USDQ/USD
  - USDQ/EUR
  - USDD/USD
  - USDD/EUR
  - PYUSD/USD
  - PYUSD/EUR
  - TUSD/USD
  - TUSD/EUR
  - USDT/USD
  - USDC/USD
  - USDC/EUR
  - USDT/EUR

# Restart configuration
restart_delay: 5  # seconds to wait before restarting after crash

# Logging configuration
log_level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
logging:
  file: tidepool.log
  format: "%(asctime)s - %(levelname)s - %(message)s"

# Data storage configuration (see docs/parquet-storage-spec.md)
storage:
  hot_dir: data/hot              # hot tier: data/hot/{book_delta,book_snapshot,trade}/ts_<start_ns>_<end_ns>.parquet
  roll_interval_seconds: 60      # close a hot file every N seconds
  max_rows_per_file: 500000      # also roll early if a buffer reaches this many rows
  compression: lz4               # light codec for the hot tier
  queue_maxsize: 200000          # rows buffered between websocket and writer before dropping
  snapshot_interval_seconds: 300 # resubscribe for a fresh book snapshot every N seconds (0 disables)

# Kraken WebSocket configuration (optional)
kraken:
  # Add any Kraken-specific settings here
  reconnect_interval: 30  # seconds
  heartbeat_timeout: 60   # seconds

# Monitoring (future feature)
monitoring:
  enabled: false
  prometheus_port: 8000
  health_check_port: 8001