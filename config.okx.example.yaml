exchange: okx
markets:
  - BTC/USDT
  - ETH/USDT
restart_delay: 5
log_level: INFO
logging:
  file: tidepool-okx.log
storage:
  hot_dir: data/hot
  roll_interval_seconds: 60
  max_rows_per_file: 500000
  compression: lz4
  queue_maxsize: 200000
  snapshot_interval_seconds: 300 # 0 disables periodic checkpoints
okx:
  reconnect_interval: 5
  snapshot_timeout: 30
